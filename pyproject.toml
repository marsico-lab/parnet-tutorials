[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "parnet-tutorials"
version = "0.1.0"
description = "Tutorial notebooks for PARNET"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
# Executing the notebooks in CI or via tests/run_notebooks.py.
run = ["nbclient>=0.9", "nbformat>=5.9", "ipykernel>=6"]
# Individual notebooks declare what they additionally need; see each notebook's first cell.
embeddings = ["umap-learn>=0.5", "scikit-learn>=1.3"]
motifs = ["logomaker>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
